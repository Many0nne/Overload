name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  app:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: app/package-lock.json
      - run: npm ci
      - run: npx biome ci .
      - run: npx tsc --noEmit
      - run: npx vitest run
      - run: npx vite build
      # Budget du JS initial (§15) : bloquant.
      - run: npm run budget

  # Lighthouse CI (§15) : rapport indicatif, jamais bloquant (scores trop bruités sur les runners partagés).
  lighthouse:
    runs-on: ubuntu-latest
    continue-on-error: true
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: app/package-lock.json
      - run: npm ci
      - run: npx vite build
      - run: npm run lighthouse
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: lighthouse
          path: app/lhci/
          retention-days: 14

  # Tests de synchro (§17) : moteur réel + fake-indexeddb contre Supabase local (Auth + PostgREST).
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: app/package-lock.json
      - uses: supabase/setup-cli@v1
        with:
          version: latest
      - run: supabase start -x studio,imgproxy,mailpit,realtime,edge-runtime,logflare,vector,supavisor,postgres-meta
      - run: npm ci
        working-directory: app
      - run: npm run test:sync
        working-directory: app
        env:
          SUPABASE_CLI: supabase

  # E2E Playwright (§17) : build de production + Supabase local, WebKit et Chromium en viewport iPhone.
  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: app/package-lock.json
      - uses: supabase/setup-cli@v1
        with:
          version: latest
      - run: supabase start -x studio,imgproxy,mailpit,realtime,edge-runtime,logflare,vector,supavisor,postgres-meta
      - run: npm ci
        working-directory: app
      - run: npx playwright install --with-deps chromium webkit
        working-directory: app
      - run: npm run e2e
        working-directory: app
        env:
          SUPABASE_CLI: supabase
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: |
            app/playwright-report/
            app/test-results/
          retention-days: 7

  database:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with:
          version: latest
      - run: supabase db start
      - run: supabase test db
