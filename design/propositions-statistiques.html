<!doctype html>
<html lang="fr" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Overload : refonte des statistiques (issue #103)</title>
<style>
/* ---------- Jetons de design (repris de design/maquette.html) ---------- */
:root{
  --radius:14px; --radius-sm:10px;
  --font:-apple-system,BlinkMacSystemFont,"SF Pro Text","Inter","Segoe UI",Roboto,sans-serif;
}
[data-theme=dark]{
  --page:#07080a; --bg:#0d0e11; --surface:#16181d; --surface-2:#1e2128; --line:#2a2e37;
  --text:#f3f5f8; --text-2:#a3abb8; --muted:#6f7785;
  --accent:#4c8dff; --accent-ink:#fff; --accent-soft:rgba(76,141,255,.15);
  --done:#22c55e; --done-soft:rgba(34,197,94,.15);
  --warm:#f5a524; --drop:#b197fc; --fail:#f87171; --gold:#f5c518;
  --shadow:0 30px 80px rgba(0,0,0,.6);
}
[data-theme=light]{
  --page:#e7eaf0; --bg:#ffffff; --surface:#f4f6f9; --surface-2:#eaedf2; --line:#e2e6ed;
  --text:#101318; --text-2:#4b5563; --muted:#8a93a3;
  --accent:#1f6fe5; --accent-ink:#fff; --accent-soft:rgba(31,111,229,.1);
  --done:#16a34a; --done-soft:#dcf7e6;
  --warm:#d98a00; --drop:#7c5cd6; --fail:#dc2626; --gold:#c99a00;
  --shadow:0 30px 80px rgba(20,30,50,.25);
}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:var(--font);background:var(--page);color:var(--text);-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}

/* ---------- Habillage du document ---------- */
.topbar{display:flex;align-items:center;gap:16px;padding:14px 24px;border-bottom:1px solid var(--line);position:sticky;top:0;background:var(--page);z-index:10;flex-wrap:wrap}
.topbar h1{font-size:17px;font-weight:700}
.topbar .sub{color:var(--muted);font-size:13px}
.topbar .spacer{flex:1}
.toc{display:flex;gap:6px;flex-wrap:wrap}
.toc a{font-size:13px;color:var(--text-2);text-decoration:none;padding:6px 10px;border-radius:8px;background:var(--surface)}
.toc a:hover{color:var(--accent)}
.doc{max-width:1320px;margin:0 auto;padding:24px 24px 80px}
.doc h2{font-size:21px;font-weight:800;letter-spacing:-.01em;margin:44px 0 6px;display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.doc h2:first-child{margin-top:0}
.doc h3{font-size:15px;font-weight:700;margin:22px 0 8px}
.doc p,.doc li{font-size:14px;line-height:1.55;color:var(--text-2);max-width:900px}
.doc p+p{margin-top:8px}
.doc ul.l{margin:6px 0 0 18px}
.doc code{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:12.5px;background:var(--surface-2);padding:1px 5px;border-radius:5px;color:var(--text)}
.key{display:inline-grid;place-items:center;min-width:30px;height:30px;padding:0 8px;border-radius:9px;background:var(--accent);color:var(--accent-ink);font-size:15px}
.badge-reco{font-size:12px;font-weight:700;color:var(--done);background:var(--done-soft);padding:3px 9px;border-radius:10px}
.phones{display:flex;flex-wrap:wrap;gap:28px;margin-top:16px}
.phone-wrap{display:flex;flex-direction:column;gap:8px;max-width:100%}
.phone-cap{font-size:13px;color:var(--muted);max-width:390px;line-height:1.4}
.phone-cap b{color:var(--text-2)}
.cols{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-top:14px;max-width:1100px}
@media (max-width:820px){.cols{grid-template-columns:1fr}}
.box{background:var(--surface);border-radius:var(--radius);padding:14px 16px}
.box h4{font-size:13px;text-transform:uppercase;letter-spacing:.06em;color:var(--text-2);margin-bottom:8px}
.box ul{list-style:none}
.box li{font-size:13.5px;padding:3px 0 3px 20px;position:relative;max-width:none}
.box li::before{position:absolute;left:0;font-weight:800}
.box.plus li::before{content:"+";color:var(--done)}
.box.moins li::before{content:"−";color:var(--fail)}
table.t{border-collapse:collapse;width:100%;max-width:1200px;margin-top:10px;font-size:13px}
table.t th,table.t td{text-align:left;vertical-align:top;padding:8px 10px;border-bottom:1px solid var(--line);line-height:1.45;color:var(--text-2)}
table.t th{font-size:11.5px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);font-weight:700;background:var(--surface)}
table.t td:first-child{color:var(--text);font-weight:600;white-space:nowrap}
table.t td b{color:var(--text)}
.scroll-x{overflow-x:auto;max-width:100%}
.tg{display:inline-block;font-size:11px;font-weight:700;padding:1px 7px;border-radius:8px;margin:1px 2px 1px 0;white-space:nowrap}
.tg.ok{background:var(--done-soft);color:var(--done)}
.tg.new{background:var(--accent-soft);color:var(--accent)}
.tg.no{background:var(--surface-2);color:var(--muted)}
.tg.warn{background:rgba(245,165,36,.15);color:var(--warm)}
.reco-box{border:1.5px solid var(--done);border-radius:var(--radius);padding:16px 18px;margin-top:12px;max-width:1100px;background:var(--done-soft)}
.reco-box p,.reco-box li{color:var(--text)}

/* ---------- Téléphone (390 px, iPhone) ---------- */
.phone{width:390px;max-width:100%;height:780px;border-radius:44px;background:var(--bg);overflow:hidden;position:relative;
  box-shadow:var(--shadow),0 0 0 8px #1b1c20,0 0 0 9px #3a3c42;display:flex;flex-direction:column;flex-shrink:0;margin:9px}
.statusbar{height:44px;display:flex;align-items:flex-end;justify-content:space-between;padding:0 30px 6px 34px;font-size:15px;font-weight:600;flex-shrink:0}
.scr{flex:1;overflow-y:auto;padding-bottom:28px;scrollbar-width:thin}
.head{display:flex;align-items:center;gap:10px;padding:6px 14px 10px;position:sticky;top:0;background:var(--bg);z-index:5}
.head .title-sm{font-size:17px;font-weight:700;flex:1;text-align:center}
.icon-btn{width:38px;height:38px;border-radius:50%;display:grid;place-items:center;color:var(--text-2);font-size:24px;line-height:1}
.sticky-sub{position:sticky;top:54px;background:var(--bg);z-index:4;padding:0 18px 10px}
.section{padding:0 18px;margin-top:18px}
.section-title{display:flex;align-items:center;justify-content:space-between;font-size:13px;font-weight:700;color:var(--text-2);
  text-transform:uppercase;letter-spacing:.06em;margin-bottom:10px}
.section-title .seg button{text-transform:none;letter-spacing:0}
.section-title .r{text-transform:none;letter-spacing:0;font-weight:600;color:var(--muted);font-size:12.5px}
.card{background:var(--surface);border-radius:var(--radius);padding:14px 16px}
.card+.card{margin-top:10px}
.muted{color:var(--muted)} .t2{color:var(--text-2)}
.fs-12{font-size:12px} .fs-13{font-size:13px} .mt-6{margin-top:6px} .mt-10{margin-top:10px} .mt-12{margin-top:12px}
.seg{display:inline-flex;background:var(--surface-2);border-radius:10px;padding:3px}
.seg button{padding:6px 12px;border-radius:8px;font-size:13px;color:var(--text-2);min-height:32px}
.seg button.on{background:var(--bg);color:var(--text);font-weight:600;box-shadow:0 1px 3px rgba(0,0,0,.2)}
.seg.stretch{display:flex;width:100%}
.seg.stretch button{flex:1;padding:6px 4px}
.seg.big button{min-height:38px;font-size:14px}
.chips{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none}
.chip{flex-shrink:0;height:32px;padding:0 13px;border-radius:16px;background:var(--surface-2);font-size:13px;font-weight:600;color:var(--text-2)}
.chip.on{background:var(--accent);color:var(--accent-ink)}
.hero{font-size:30px;font-weight:800;letter-spacing:-.02em;font-variant-numeric:tabular-nums}
.hero.compact{font-size:24px}
.pr-pill{display:inline-flex;align-items:center;gap:4px;font-size:13px;font-weight:700;color:var(--text)}
.row-link{display:flex;align-items:center;gap:14px;padding:12px 16px;min-height:60px;background:var(--surface);font-size:15px;font-weight:550;width:100%;text-align:left}
.row-link:first-child{border-radius:var(--radius) var(--radius) 0 0}
.row-link:last-child{border-radius:0 0 var(--radius) var(--radius)}
.row-link+.row-link{border-top:1px solid var(--line)}
.row-link .ico{width:34px;height:34px;border-radius:10px;background:var(--accent-soft);color:var(--accent);display:grid;place-items:center;flex-shrink:0;font-size:17px}
.row-link .txt{flex:1;min-width:0}
.row-link .txt small{display:block;font-size:13px;color:var(--muted);font-weight:500;margin-top:2px}
.row-link .end{color:var(--muted);font-size:18px}
.row-link.off{opacity:.55}

/* Chiffres clés */
.kpis{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.kpi{background:var(--surface);border-radius:12px;padding:11px 12px}
.kpi .k{display:block;font-size:12px;color:var(--muted);font-weight:500}
.kpi .v{font-size:19px;font-weight:800;font-variant-numeric:tabular-nums;margin-top:2px;letter-spacing:-.01em}
.kpi .d{font-size:12px;font-weight:700;margin-top:1px;font-variant-numeric:tabular-nums}
.d.up{color:var(--done)} .d.down{color:var(--fail)} .d.eq{color:var(--muted)}
.totals{display:grid;grid-template-columns:repeat(3,1fr);gap:12px 8px;text-align:center}
.totals .v{font-size:17px;font-weight:800;font-variant-numeric:tabular-nums}
.totals .k{font-size:11.5px;color:var(--muted);margin-top:1px}

/* Calendrier, barres */
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:5px;text-align:center}
.cal .h{font-size:11px;color:var(--muted);font-weight:700}
.cal .c{aspect-ratio:1;border-radius:50%;display:grid;place-items:center;font-size:12.5px;font-variant-numeric:tabular-nums;color:var(--text-2)}
.cal .c.on{background:var(--accent);color:var(--accent-ink);font-weight:700}
.cal .c.today{box-shadow:inset 0 0 0 2px var(--accent)}
.cal .c.fut{color:var(--muted);opacity:.5}
.hbar{display:grid;grid-template-columns:86px 1fr 46px;align-items:center;gap:10px;font-size:13px;padding:4px 0}
.hbar .track{height:10px}
.hbar .fill{height:10px;border-radius:0 4px 4px 0;background:var(--accent)}
.hbar .n{text-align:right;font-weight:700;font-variant-numeric:tabular-nums}
svg.chart{display:block;width:100%;overflow:visible}
svg .bar{fill:var(--accent);fill-opacity:.35}
svg .bar.last{fill-opacity:1}
svg .axis{fill:var(--muted);font-size:10px;font-family:var(--font)}
svg .ln{fill:none;stroke:var(--accent);stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
svg .ln.flat{stroke:var(--muted)}
.stack{display:flex;height:14px;border-radius:7px;overflow:hidden;gap:2px}
.stack span{display:block;height:100%}
.legend{display:flex;flex-wrap:wrap;gap:6px 14px;margin-top:9px;font-size:12.5px;color:var(--text-2)}
.legend i{display:inline-block;width:9px;height:9px;border-radius:3px;margin-right:5px;vertical-align:0}
.legend b{color:var(--text);font-variant-numeric:tabular-nums}
.balance{display:grid;grid-template-columns:52px 1fr 52px;gap:8px;align-items:center;font-size:12.5px;padding:5px 0}
.balance .r{text-align:right}
.balance b{font-variant-numeric:tabular-nums}
.balance .stack{height:10px}
.goal{padding:9px 0;border-bottom:1px solid var(--line)}
.goal:last-child{border:0;padding-bottom:2px}
.goal .top{display:flex;justify-content:space-between;gap:8px;font-size:14px}
.goal .top b{font-variant-numeric:tabular-nums}
.goal .sub{font-size:12.5px;color:var(--muted);margin-top:2px}
.goal .track{height:6px;border-radius:3px;background:var(--surface-2);margin-top:7px;overflow:hidden}
.goal .track span{display:block;height:100%;background:var(--accent);border-radius:3px}
.mom{display:flex;align-items:center;gap:10px;padding:8px 0;border-bottom:1px solid var(--line);min-height:44px}
.mom:last-child{border:0}
.mom .n{flex:1;min-width:0;font-size:14px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mom .n small{display:block;font-weight:500;color:var(--muted);font-size:12px}
.mom svg{width:70px;flex-shrink:0}
.mom .v{font-size:13px;font-weight:700;width:66px;text-align:right;font-variant-numeric:tabular-nums}
.list-row{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:9px 0;border-bottom:1px solid var(--line);font-size:14px;min-height:44px}
.list-row:last-child{border:0}
.list-row b{font-variant-numeric:tabular-nums}
.list-row .chev{color:var(--muted)}

/* Records récents (variante C retenue dans #102) */
.rec-day{font-size:12px;font-weight:700;color:var(--muted);padding-top:12px}
.rec-day:first-child{padding-top:0}
.rec-line{display:flex;align-items:center;gap:10px;min-height:44px;padding:6px 0}
.rec-main{flex:1;min-width:0}
.rec-name{font-weight:600;font-size:14.5px}
.rec-crit{font-size:12.5px;color:var(--muted)}
.rec-val{text-align:right;white-space:nowrap}
.rec-val b{font-size:14.5px;font-variant-numeric:tabular-nums}
.rec-gain{display:block;font-size:12.5px;font-weight:700;color:var(--done)}
.rec-chev{color:var(--muted)}

/* Sections repliables (A) */
.fold{margin-top:10px}
.fold-h{display:flex;align-items:center;gap:10px;width:100%;min-height:52px;padding:10px 16px;background:var(--surface);border-radius:var(--radius);text-align:left}
.fold.open .fold-h{border-radius:var(--radius) var(--radius) 0 0;border-bottom:1px solid var(--line)}
.fold-h .tt{font-size:15px;font-weight:700}
.fold-h .sm{font-size:12.5px;color:var(--muted);margin-left:auto;text-align:right}
.fold-h .ch{color:var(--muted);transition:transform .15s;font-size:16px}
.fold.open .fold-h .ch{transform:rotate(90deg)}
.fold-b{background:var(--surface);border-radius:0 0 var(--radius) var(--radius);padding:12px 16px 14px}
.fold-b .sub-t{font-size:12px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.05em;margin:14px 0 8px}
.fold-b .sub-t:first-child{margin-top:0}

/* Carte musculaire schématique (l'app utilise les tracés réels de ui/BodyMap) */
.bm{display:flex;justify-content:center;gap:22px}
.bm svg{height:200px;width:auto}
.bm .z0{fill:var(--text);fill-opacity:.12}
.bm .z1{fill:var(--accent);fill-opacity:.25}
.bm .z2{fill:var(--accent);fill-opacity:.45}
.bm .z3{fill:var(--accent);fill-opacity:.7}
.bm .z4{fill:var(--accent);fill-opacity:1}
.bm-scale{display:flex;align-items:center;gap:6px;justify-content:center;font-size:11.5px;color:var(--muted);margin-top:8px}
.bm-scale i{width:16px;height:8px;border-radius:2px;display:inline-block}

/* États vides */
.empty{text-align:center;padding:16px 8px}
.empty .ic{font-size:26px}
.empty h5{font-size:15px;font-weight:700;margin-top:6px}
.empty p{font-size:13px;color:var(--muted);margin-top:4px;line-height:1.45}
.empty .prog{height:6px;border-radius:3px;background:var(--surface-2);margin:10px auto 0;max-width:180px;overflow:hidden}
.empty .prog span{display:block;height:100%;background:var(--accent)}
.hint{font-size:12.5px;color:var(--muted);padding:12px 2px 0;line-height:1.45}
.hint a{color:var(--accent);text-decoration:none;font-weight:600}
</style>
</head>
<body>
<div class="topbar">
  <h1>Statistiques : propositions de refonte</h1>
  <span class="sub">issue #103, étape 1 · écrans iPhone 390 px</span>
  <span class="spacer"></span>
  <nav class="toc"><a href="#A">A · Page repliable</a><a href="#B">B · Onglets</a><a href="#C">C · Sommaire</a><a href="#indicateurs">Indicateurs</a><a href="#reco">Recommandation</a></nav>
  <div class="seg" id="theme"><button data-t="dark">Sombre</button><button data-t="light">Clair</button></div>
</div>
<main class="doc" id="root"></main>

<script>
// Données fictives cohérentes entre les maquettes : « aujourd'hui » = jeudi 29 octobre 2026, 186 séances depuis
// mars 2024, 3 séances par semaine environ, RPE activé sauf dans les écrans d'état vide.
const TRAINED_OCT = [1, 3, 6, 8, 10, 13, 15, 17, 20, 22, 24, 27, 29];
const WEEKS = [4, 3, 3, 2, 4, 3, 3, 4, 3, 3, 3, 2];
const MUSCLES = [
  ['Pectoraux', 42, 15.2], ['Dos', 40.5, 18.9], ['Quadriceps', 33, 21.4], ['Épaules', 31.5, 7.1], ['Ischios', 22, 10.8],
  ['Fessiers', 21.5, 9.6], ['Triceps', 21, 4.0], ['Biceps', 18, 2.9], ['Mollets', 12, 3.6], ['Abdos', 9, 0.4],
];
const RECORDS_BY_MONTH = [['mai', 9], ['juin', 12], ['juil.', 7], ['août', 4], ['sept.', 11], ['oct.', 15]];
const nf = (v) => String(v).replace('.', ',');

// Cette méthode permet de dessiner l'en-tête d'un écran (retour, titre centré).
const head = (title) => `<div class="head"><button class="icon-btn" aria-label="Retour">‹</button><span class="title-sm">${title}</span><span style="width:38px"></span></div>`;

// Cette méthode permet d'habiller un contenu en téléphone 390 px avec sa légende.
function phone(cap, inner) {
  return `<div class="phone-wrap"><div class="phone"><div class="statusbar"><span>9:41</span><span>●●● ▮</span></div>
    <div class="scr">${inner}</div></div><div class="phone-cap">${cap}</div></div>`;
}

// Cette méthode permet de dessiner les chips de période (sélectionnée = on).
const periods = (on = '30 j', list = ['7 j', '30 j', '3 mois', '1 an', 'Tout']) =>
  `<div class="chips">${list.map((p) => `<button class="chip${p === on ? ' on' : ''}">${p}</button>`).join('')}</div>`;

// Cette méthode permet de dessiner un segmented control (option active = on).
const seg = (opts, on, cls = '') =>
  `<div class="seg stretch ${cls}">${opts.map((o) => `<button class="${o === on ? 'on' : ''}">${o}</button>`).join('')}</div>`;

// Cette méthode permet d'afficher une tuile de chiffre clé avec son écart à la période précédente.
const kpi = (k, v, d, dir = 'up') => `<div class="kpi"><span class="k">${k}</span><div class="v">${v}</div>${d ? `<div class="d ${dir}">${d}</div>` : ''}</div>`;

// Cette méthode permet de dessiner le calendrier d'octobre 2026 (1er = jeudi, semaine lundi → dimanche).
function calendar(trained = TRAINED_OCT) {
  const head = ['L', 'M', 'M', 'J', 'V', 'S', 'D'].map((d) => `<div class="h">${d}</div>`).join('');
  const blanks = '<div></div>'.repeat(3);
  let days = '';
  for (let d = 1; d <= 31; d++) {
    const cls = [trained.includes(d) ? 'on' : '', d === 29 ? 'today' : '', d > 29 ? 'fut' : ''].join(' ');
    days += `<div class="c ${cls}">${d}</div>`;
  }
  return `<div class="cal">${head}${blanks}${days}</div>`;
}

// Cette méthode permet d'afficher la carte calendrier + série de semaines, comme l'écran actuel.
const calendarCard = (streak = 14, trained) => `<div class="card"><div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:12px">
  <div style="display:flex;align-items:center;gap:4px"><button class="icon-btn">‹</button><b>Octobre 2026</b></div>
  <span class="pr-pill">🔥 ${streak} semaine${streak > 1 ? 's' : ''}</span></div>${calendar(trained)}</div>`;

// Cette méthode permet de dessiner un histogramme hebdomadaire SVG (dernière barre pleine), comme ui/BarChart.
function bars(values, first = '10 août', last = 'cette semaine', h = 110) {
  const W = 354, P = 18, max = Math.max(...values) * 1.1 || 1, slot = W / values.length, gap = slot > 12 ? 6 : 2, bw = Math.max(2, slot - gap);
  const r = values.map((v, i) => {
    const bh = (v / max) * (h - P);
    return `<rect class="bar${i === values.length - 1 ? ' last' : ''}" x="${i * slot + gap / 2}" y="${h - P - bh}" width="${bw}" height="${Math.max(bh, 2)}" rx="3"/>`;
  }).join('');
  return `<svg class="chart" viewBox="0 0 ${W} ${h}">${r}<text class="axis" x="0" y="${h - 4}">${first}</text><text class="axis" x="${W}" y="${h - 4}" text-anchor="end">${last}</text></svg>`;
}

// Cette méthode permet de dessiner une barre horizontale par muscle (valeur max = pleine largeur).
function hbars(rows, idx = 1, unit = '') {
  const max = Math.max(...rows.map((r) => r[idx]));
  return rows.map((r) => `<div class="hbar"><span>${r[0]}</span><div class="track"><div class="fill" style="width:${(r[idx] / max) * 100}%"></div></div><span class="n">${nf(r[idx])}${unit}</span></div>`).join('');
}

// Cette méthode permet de dessiner une barre empilée (répartition) avec sa légende.
function stack(parts) {
  const bar = parts.map(([, pct, color]) => `<span style="width:${pct}%;background:var(${color})"></span>`).join('');
  const leg = parts.map(([label, pct, color]) => `<span><i style="background:var(${color})"></i>${label} <b>${pct} %</b></span>`).join('');
  return `<div class="stack">${bar}</div><div class="legend">${leg}</div>`;
}

// Cette méthode permet de dessiner un équilibre entre deux groupes (push/pull, haut/bas) sur une barre à deux couleurs.
const balance = (a, pa, b, pb) => `<div class="balance"><span>${a}</span><div class="stack"><span style="width:${pa}%;background:var(--accent)"></span><span style="width:${pb}%;background:var(--drop)"></span></div><span class="r">${b}</span></div>
  <div class="balance" style="padding-top:0"><b>${pa} %</b><span></span><b class="r">${pb} %</b></div>`;

// Cette méthode permet de dessiner une petite courbe (sparkline) de 1RM estimé hebdomadaire.
function spark(pts, flat = false) {
  const W = 70, H = 26, min = Math.min(...pts), max = Math.max(...pts), span = Math.max(max - min, max * 0.1);
  const d = pts.map((p, i) => `${i ? 'L' : 'M'}${(i / (pts.length - 1)) * W},${H - 3 - ((p - min) / span) * (H - 6)}`).join(' ');
  return `<svg viewBox="0 0 ${W} ${H}"><path class="ln${flat ? ' flat' : ''}" d="${d}"/></svg>`;
}

// Cette méthode permet d'appliquer le thème choisi (clair ou sombre) à toute la page, maquettes comprises.
function setTheme(t) {
  document.documentElement.dataset.theme = t;
  document.querySelectorAll('#theme button').forEach((b) => b.classList.toggle('on', b.dataset.t === t));
}
document.querySelectorAll('#theme button').forEach((b) => b.addEventListener('click', () => setTheme(b.dataset.t)));
setTheme(window.matchMedia && matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark');
